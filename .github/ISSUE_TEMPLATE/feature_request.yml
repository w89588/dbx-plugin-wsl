name: 功能建议 / Feature request
description: 提出使用场景或改进建议 / Suggest an improvement
title: "[Feature] "
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 你在什么情况下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的功能 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前解决方式或补充信息 / Workaround or additional context
